

        <!-- CAÇA-PALAVRAS MULTILÍNGUE -->
        <section id="wordsearch-section" class="w-full max-w-4xl" aria-labelledby="ws-heading">
            <div class="glass-card rounded-3xl p-5 sm:p-8 space-y-5">
                <div class="space-y-2">
                    <div class="w-12 h-12 mx-auto bg-rose-600/20 rounded-full flex items-center justify-center text-rose-300 text-2xl"><i class="fa-solid fa-magnifying-glass"></i></div>
                    <h3 id="ws-heading" class="font-serifHeader text-2xl sm:text-3xl text-white font-bold">Caça-Palavras Multilíngue</h3>
                    <p class="text-xs sm:text-sm text-roseGold/75">Encontre as palavras arrastando ou tocando nas extremidades.</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-2xl mx-auto text-left">
                    <label class="text-xs text-roseGold/80 space-y-1.5">
                        <span class="block">Idioma</span>
                        <select id="ws-language" class="ws-select">
                            <option value="pt">Português</option><option value="it">Italiano</option><option value="es">Espanhol</option>
                            <option value="en">Inglês</option><option value="de">Alemão</option><option value="fr">Francês</option>
                            <option value="nl">Holandês</option><option value="sv">Sueco</option><option value="no">Norueguês (bokmål)</option>
                        </select>
                    </label>
                    <label class="text-xs text-roseGold/80 space-y-1.5">
                        <span class="block">Número de palavras</span>
                        <select id="ws-count" class="ws-select">
                            <option value="3">3 palavras</option><option value="5">5 palavras</option><option value="8" selected>8 palavras</option>
                            <option value="10">10 palavras</option><option value="12">12 palavras</option><option value="15">15 palavras</option>
                            <option value="20">20 palavras</option>
                        </select>
                    </label>
                    <label class="text-xs text-roseGold/80 space-y-1.5">
                        <span class="block">Tamanho das palavras</span>
                        <select id="ws-size" class="ws-select">
                            <option value="3-5">Curtas (3–5 letras)</option>
                            <option value="5-7" selected>Médias (5–7 letras)</option>
                            <option value="7-10">Longas (7–10 letras)</option>
                            <option value="3-10">Variadas (3–10 letras)</option>
                            <option value="4-4">Exatamente 4 letras</option>
                            <option value="5-5">Exatamente 5 letras</option>
                            <option value="6-6">Exatamente 6 letras</option>
                            <option value="7-7">Exatamente 7 letras</option>
                            <option value="8-8">Exatamente 8 letras</option>
                        </select>
                    </label>
                </div>
                <fieldset class="text-left max-w-2xl mx-auto rounded-2xl p-3 sm:p-4 border border-roseGold/20 bg-white/[.03]">
                    <legend class="text-xs font-semibold text-roseGold/90 px-2">Direções permitidas</legend>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-1">
                        <label class="ws-option"><input type="checkbox" id="ws-horizontal" checked><span>Horizontal →</span></label>
                        <label class="ws-option"><input type="checkbox" id="ws-vertical" checked><span>Vertical ↓</span></label>
                        <label class="ws-option"><input type="checkbox" id="ws-diagonal" checked><span>Diagonal ↘ ↙</span></label>
                        <label class="ws-option"><input type="checkbox" id="ws-reverse" checked><span>Invertidas ← ↑ ↖ ↗</span></label>
                    </div>
                    
                </fieldset>
                <div class="flex flex-wrap items-center justify-center gap-3">
                    <button id="ws-new" type="button" class="rounded-xl px-5 py-3 bg-rose-700 hover:bg-rose-600 text-white font-semibold text-sm transition"><i class="fa-solid fa-shuffle mr-1"></i>Gerar caça-palavras</button>
                    <button id="ws-reveal" type="button" class="glass-card rounded-xl px-4 py-3 text-xs text-roseGold hover:text-white" disabled>Mostrar soluções</button>
                </div>
                <p id="ws-status" class="text-sm text-rose-200 min-h-5" aria-live="polite" role="status">Escolha as opções e gere um caça-palavras.</p>
                <div class="ws-zoom-tools" role="group" aria-label="Controles de zoom do caça-palavras">
                    <button type="button" id="ws-fit" title="Mostrar a grade inteira" disabled>Ajustar à tela</button>
                    <button type="button" id="ws-zoom-out" aria-label="Diminuir grade" title="Diminuir zoom" disabled>−</button>
                    <button type="button" id="ws-zoom-in" aria-label="Ampliar grade" title="Ampliar zoom" disabled>+</button>
                    <span id="ws-zoom-status" role="status" aria-live="polite">Grade ajustada à tela</span>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_minmax(150px,210px)] gap-4 lg:gap-6 items-start min-w-0">
                    <div class="ws-scroll border border-roseGold/20 bg-black/25 rounded-2xl p-2 sm:p-3" id="ws-scroll" tabindex="0" aria-label="Grade do caça-palavras; depois de ampliar, deslize horizontalmente para ver o restante">
                        <div id="ws-board" class="ws-board" role="group" aria-label="Grade do caça-palavras"></div>
                    </div>
                    <aside class="border border-roseGold/20 rounded-2xl p-4 bg-white/[.03] text-left space-y-3">
                        <div class="flex flex-wrap justify-between gap-2 items-center">
                            <h4 class="font-serifHeader text-lg text-white">Palavras para encontrar</h4>
                            <span id="ws-progress" class="text-rose-300 text-xs font-semibold" aria-live="polite">0 / 0</span>
                        </div>
                        <ul id="ws-word-list" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-1 gap-2" aria-label="Palavras escondidas"></ul>
                        <p id="ws-source" class="text-[10px] text-roseGold/65"></p>
                    </aside>
                </div>
                
            </div>
        </section>
