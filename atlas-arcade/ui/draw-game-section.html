
<section id="draw-game-section" class="w-full max-w-4xl gg-restored" aria-labelledby="gg-draw-title">
  <div class="gg-game-shell">
    <div class="gg-game-header"><span class="gg-eyebrow">ATELIÊ DE VIAGEM</span><h2 id="gg-draw-title">Desenho misterioso</h2><p>Desenhe uma palavra sorteada e compartilhe o desafio para alguém adivinhar.</p></div>
    <div class="gg-form-row"><label>Idioma<select id="draw-language"><option value="pt">Português</option><option value="it">Italiano</option><option value="es">Espanhol</option><option value="en">Inglês</option><option value="de">Alemão</option><option value="fr">Francês</option><option value="nl">Holandês</option><option value="sv">Sueco</option><option value="no">Norueguês</option></select></label><button type="button" id="draw-start" class="gg-primary">Sortear palavra</button></div>
    <p id="draw-status" class="gg-status" role="status"></p>
    <div id="draw-maker" class="gg-body"><div id="draw-prompt-panel" class="hidden gg-draw-prompt">Sua palavra: <strong id="draw-secret-word"></strong> <span>Desenhe sem escrever letras!</span></div>
      <div class="gg-draw-tools" aria-label="Ferramentas de desenho"><button type="button" class="draw-color-button atlas-static-4" data-color="#23121d" aria-label="Cor preta" aria-pressed="true"></button><button type="button" class="draw-color-button atlas-static-5" data-color="#e11d48" aria-label="Cor vermelha" aria-pressed="false"></button><button type="button" class="draw-color-button atlas-static-6" data-color="#2563eb" aria-label="Cor azul" aria-pressed="false"></button><button type="button" class="draw-color-button atlas-static-7" data-color="#16a34a" aria-label="Cor verde" aria-pressed="false"></button><button type="button" class="draw-color-button atlas-static-8" data-color="#eab308" aria-label="Cor amarela" aria-pressed="false"></button><button type="button" class="draw-color-button atlas-static-9" data-color="#9333ea" aria-label="Cor roxa" aria-pressed="false"></button><button type="button" id="draw-eraser">Borracha</button><button type="button" id="draw-undo">Desfazer</button><button type="button" id="draw-clear">Limpar</button></div>
      <div id="draw-canvas-shell" class="gg-draw-shell"><canvas id="draw-canvas" width="800" height="460" aria-label="Área para desenhar"></canvas><div id="draw-eraser-preview"></div></div>
      <div class="gg-actions"><button type="button" id="draw-another-word">Nova palavra</button><button type="button" id="draw-share" class="gg-primary">Compartilhar desafio</button></div>
    </div>
    <div id="draw-viewer" class="gg-body hidden"><p id="draw-viewer-instructions" class="gg-status">Adivinhe a palavra do desenho!</p><div class="gg-draw-shell"><canvas id="draw-view-canvas" width="800" height="460" aria-label="Desenho recebido"></canvas></div><form id="draw-guess-form" class="gg-inline-form"><input id="draw-guess-input" type="text" placeholder="Sua resposta" autocomplete="off"><button type="submit" id="draw-guess-submit" class="gg-primary">Adivinhar</button></form><p id="draw-guess-status" class="gg-status"></p><button type="button" id="draw-create-another">Criar meu próprio desenho</button></div>
  </div>
</section>
